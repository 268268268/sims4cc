name: VirusTotal Scan

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to scan (e.g. v2.0.1, or leave blank for latest)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  virustotal:
    name: Scan Release Assets with VirusTotal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Release Tag
        id: resolve_tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG=$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName)
          fi
          echo "Selected release tag: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Release Assets
        run: |
          mkdir -p ./release-assets
          gh release download "${{ steps.resolve_tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --dir ./release-assets \
            --pattern "*.exe" \
            --pattern "*.zip"
          echo "Downloaded assets:"
          ls -lh ./release-assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run VirusTotal Analysis
        uses: crazy-max/ghaction-virustotal@v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            ./release-assets/*.exe
            ./release-assets/*.zip
          update_release_body: true
          request_rate: 4
